{% extends 'base.html' %}

{% block content %}

<style>
    .delete-page {
        max-width: 500px;
        margin: 70px auto;
        padding: 20px;
    }

    .delete-card {
        background: white;
        padding: 35px 25px;
        border-radius: 18px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        text-align: center;
    }

    .delete-icon {
        font-size: 50px;
        margin-bottom: 10px;
    }

    .delete-card h1 {
        color: #b02a37;
        margin-bottom: 15px;
    }

    .delete-card p {
        color: #555;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .volunteer-name {
        font-weight: bold;
        color: #075e54;
    }

    .button-group {
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    .delete-btn,
    .cancel-btn {
        padding: 11px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        border: none;
        cursor: pointer;
        font-size: 15px;
    }

    .delete-btn {
        background-color: #b02a37;
        color: white;
    }

    .cancel-btn {
        background-color: #075e54;
        color: white;
    }

    @media (max-width: 600px) {
        .delete-page {
            margin: 40px auto;
            padding: 15px;
        }

        .delete-card {
            padding: 30px 20px;
        }

        .button-group {
            flex-direction: column;
        }

        .delete-btn,
        .cancel-btn {
            width: 100%;
            box-sizing: border-box;
        }
    }
</style>

<div class="delete-page">

    <div class="delete-card">

        <div class="delete-icon">⚠️</div>

        <h1>Delete Volunteer?</h1>

        <p>
            Are you sure you want to delete
            <span class="volunteer-name">
                {{ volunteer.name }}
            </span>
            from the volunteer list?
        </p>

        <p>
            This action cannot be undone.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="button-group">

                <button type="submit" class="delete-btn">
                    🗑️ Yes, Delete
                </button>

                <a href="{% url 'volunteer_list' %}" class="cancel-btn">
                    ← Cancel
                </a>

            </div>
        </form>

    </div>

</div>

{% endblock %}
