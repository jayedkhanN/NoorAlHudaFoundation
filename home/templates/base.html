<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Noor Al Huda Foundation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f7;
            color: #333;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background-color: #075e54;
            color: white;
            min-height: 90px;
            padding: 12px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        /* Logo */

        .logo img {
            width: 125px;
            height: auto;
            display: block;
        }

        .logo {
            flex-shrink: 0;
        }

        /* Foundation Name */

        .brand {
            flex: 1;
            text-align: left;
        }

        .brand h2 {
            margin: 0;
            font-size: 23px;
        }

        .brand p {
            margin: 5px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        /* Navigation */

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #ffd166;
        }

        /* Donate Button */

        .donate-btn {
            background-color: #ffd166;
            color: #075e54 !important;
            padding: 10px 16px;
            border-radius: 6px;
            display: inline-block;
            text-decoration: none;
            font-weight: bold;
        }

        .donate-btn:hover {
            background-color: #ffb703;
        }

        /* Mobile Menu Button */

        .menu-btn {
            display: none;
            background: transparent;
            color: white;
            border: 2px solid white;
            font-size: 24px;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            text-align: center;
            padding: 75px 20px;
            background-color: #e0f2f1;
        }

        .hero h1 {
            color: #075e54;
            font-size: 38px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
        }

        .hero-buttons {
            margin-top: 25px;
        }

        .hero-buttons a {
            margin: 6px;
        }

        .primary-btn {
            background-color: #075e54;
            color: white !important;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
        }

        .primary-btn:hover {
            background-color: #064c44;
        }

        .secondary-btn {
            background-color: white;
            color: #075e54 !important;
            border: 2px solid #075e54;
            padding: 9px 17px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
        }

        .secondary-btn:hover {
            background-color: #075e54;
            color: white !important;
        }

        /* =========================
           VOLUNTEER COUNT
        ========================= */

        .volunteer-count {
            background-color: white;
            max-width: 850px;
            margin: 35px auto 0;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .volunteer-count h2 {
            color: #075e54;
            margin-top: 0;
        }

        /* =========================
           COMMON SECTION
        ========================= */

        .section {
            background-color: white;
            padding: 60px 20px;
            text-align: center;
        }

        .section:nth-child(even) {
            background-color: #f8fbfb;
        }

        .section h2 {
            color: #075e54;
            margin-bottom: 20px;
        }

        .section p {
            max-width: 800px;
            margin: 10px auto;
            line-height: 1.7;
            color: #555;
        }

        /* =========================
           SERVICE CARDS
        ========================= */

        .service-container {
            max-width: 1100px;
            margin: 30px auto 0;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .service-card,
        .volunteer-card {
            background-color: white;
            padding: 30px 20px;
            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .service-card:hover,
        .volunteer-card:hover {
            transform: translateY(-5px);

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .service-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .service-card h3,
        .volunteer-card h3 {
            color: #075e54;
            margin-bottom: 10px;
        }

        /* =========================
           FORMS
        ========================= */

        form {
            background-color: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        form input,
        form textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        form button,
        button {
            background-color: #075e54;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        form button {
            margin-top: 10px;
        }

        button:hover {
            background-color: #064c44;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            background-color: #075e54;
            color: white;
            text-align: center;
            padding: 25px 15px;
            margin-top: 0;
        }

        .footer p {
            margin: 6px 0;
        }

        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .navbar {
                padding: 12px 18px;
                min-height: 75px;
                flex-wrap: wrap;
            }

            .logo img {
                width: 95px;
            }

            .brand {
                flex: 1;
            }

            .brand h2 {
                font-size: 17px;
            }

            .brand p {
                font-size: 11px;
            }

            .menu-btn {
                display: block;
            }

            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                gap: 0;
                padding-top: 10px;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                width: 100%;
                text-align: center;
                padding: 12px;
                border-top: 1px solid rgba(255,255,255,0.15);
            }

            .hero {
                padding: 55px 18px;
            }

            .hero h1 {
                font-size: 28px;
                line-height: 1.3;
            }

            .hero p {
                font-size: 16px;
            }

            .hero-buttons a {
                display: block;
                max-width: 260px;
                margin: 10px auto;
            }

            .service-container {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .section {
                padding: 45px 18px;
            }

            .volunteer-count {
                padding: 25px 15px;
            }
        }

        /* Small Mobile */

        @media (max-width: 400px) {

            .logo img {
                width: 80px;
            }

            .brand h2 {
                font-size: 15px;
            }

            .brand p {
                font-size: 10px;
            }

            .hero h1 {
                font-size: 25px;
            }

            .section h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    {% load static %}

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            <img src="{% static 'logo.png' %}"
                 alt="Noor Al Huda Foundation">
        </div>

        <div class="brand">

            <h2>Noor Al Huda Foundation </h2>

            <p>
                Serving Humanity with Kindness and Care
            </p>

        </div>

        <!-- Mobile Menu Button -->

        <button class="menu-btn"
                onclick="toggleMenu()">
            ☰
        </button>

        <!-- Navigation Links -->

        <nav class="nav-links" id="navLinks">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'about' %}">
                About
            </a>

            <a href="{% url 'contact' %}">
                Contact
            </a>

            <a href="{% url 'volunteer_list' %}">
                Volunteers
            </a>

            <a href="/donate/" class="donate-btn">
                ❤️ Donate Now
            </a>

        </nav>

    </header>


    <!-- MAIN CONTENT -->

    {% block content %}
    {% endblock %}


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 Noor Al Huda Foundation
        </p>

        <p>
            📞 Contact us for help and support
        </p>

    </footer>


    <!-- MOBILE MENU SCRIPT -->

    <script>

        function toggleMenu() {

            const menu =
                document.getElementById("navLinks");

            menu.classList.toggle("active");

        }

    </script>

</body>

</html>
